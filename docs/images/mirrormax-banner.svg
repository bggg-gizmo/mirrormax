<svg xmlns="http://www.w3.org/2000/svg" width="960" height="310" viewBox="0 0 960 310" role="img" aria-labelledby="title desc">
  <title id="title">MirrorMax — Unfold your reality</title>
  <desc id="desc">A black, slime-green, and purple banner for the MirrorMax Android reflection studio.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="80%"><stop stop-color="#101119"/><stop offset="1" stop-color="#1f1835"/></linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#342653"/><stop offset="1" stop-color="#1a172b"/></linearGradient>
    <linearGradient id="ridge" x1="0%" y1="0%" x2="0%" y2="100%"><stop stop-color="#9274df"/><stop offset="1" stop-color="#3c2c60"/></linearGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0v22" fill="none" stroke="#afa0df" opacity=".15"/></pattern>
    <pattern id="stars" width="173" height="74" patternUnits="userSpaceOnUse"><path d="M12 12h2m37 41h1m59-24h2m42 31h1" stroke="#dbc9ff" opacity=".45" stroke-width="2" stroke-linecap="round"/></pattern>
    <g id="quarter">
      <rect width="170" height="96" fill="url(#panel)"/><rect width="170" height="96" fill="url(#stars)"/>
      <circle cx="102" cy="34" r="16" fill="#baff46"/>
      <path d="M0 74 28 64 58 71 89 57 122 68 147 53 170 60V96H0Z" fill="url(#ridge)"/>
      <path d="M0 90 39 72 64 78 86 72 116 81 143 67 170 78V96H0Z" fill="#211a36"/>
    </g>
    <clipPath id="screen"><rect x="551" y="59" width="340" height="192" rx="18"/></clipPath>
  </defs>
  <rect x="1" y="1" width="958" height="308" rx="26" fill="url(#bg)" stroke="#433754" stroke-width="2"/>
  <path d="M511 2h416q31 0 31 29v248q0 29-31 29H390Z" fill="url(#grid)" opacity=".7"/>
  <g transform="translate(58 48)">
    <rect width="50" height="50" rx="14" fill="#baff46"/>
    <path d="m11 15 11-4v27l-11-4zm28 0-11-4v27l11-4z" fill="#19251b"/>
  </g>
  <text x="125" y="80" fill="#c1b6fa" font-size="14" font-weight="700" letter-spacing="3" font-family="Arial,sans-serif">REFLECTION STUDIO</text>
  <text x="54" y="160" fill="#f5f4fb" font-size="71" font-weight="800" letter-spacing="-3.6" font-family="Arial,sans-serif">MirrorMax</text>
  <text x="58" y="204" fill="#dad5f1" font-size="26" font-weight="600" font-family="Arial,sans-serif">Unfold your reality.</text>
  <rect x="58" y="234" width="88" height="27" rx="13.5" fill="#26331c" stroke="#526b34"/>
  <text x="73" y="252" fill="#baff46" font-size="11" font-weight="700" letter-spacing="1.25" font-family="Arial,sans-serif">ANDROID</text>
  <rect x="156" y="234" width="133" height="27" rx="13.5" fill="#30243f" stroke="#654887"/>
  <text x="172" y="252" fill="#e0ccff" font-size="11" font-weight="700" letter-spacing="1.25" font-family="Arial,sans-serif">TWO MIRROR PASSES</text>
  <g clip-path="url(#screen)">
    <use href="#quarter" xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="#quarter" transform="translate(551 59)"/>
    <use href="#quarter" xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="#quarter" transform="translate(891 59) scale(-1 1)"/>
    <use href="#quarter" xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="#quarter" transform="translate(551 251) scale(1 -1)"/>
    <use href="#quarter" xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="#quarter" transform="translate(891 251) scale(-1 -1)"/>
  </g>
  <rect x="551" y="59" width="340" height="192" rx="18" fill="none" stroke="#9274df" stroke-width="1.5"/>
  <path d="M721 45v13m0 193v13m-184-109h13m341 0h13" stroke="#baff46" stroke-width="1.5" stroke-linecap="round"/>
